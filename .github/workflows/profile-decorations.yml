name: Update Profile Decorations

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-light.svg?palette=github-light
            snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution island
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect outputs
        run: |
          mkdir -p dist
          mv -f snake-light.svg snake-dark.svg dist/ 2>/dev/null || true
          mv -f profile-3d-contrib/profile-season-animate.svg profile-3d-contrib/profile-night-rainbow.svg dist/ 2>/dev/null || true
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
